<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishGuard Shield</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e17;
      color: #f3f4f6;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }
    .brand-title span {
      color: #00f2fe;
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151; transition: .3s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(16px); }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #162032;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 1.3rem;
      font-weight: 800;
      font-family: monospace;
      color: #00f2fe;
    }
    .stat-num.danger { color: #ef4444; }
    .stat-lbl {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .quick-scan-box {
      background: #162032;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .quick-scan-box h4 {
      margin: 0 0 8px 0;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #cbd5e1;
    }
    .input-grp {
      display: flex;
      gap: 6px;
    }
    .input-grp input {
      flex: 1;
      background: #0a0e17;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 8px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }
    .input-grp button {
      background: #00f2fe;
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .scan-res-area {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      display: none;
    }
    .res-safe { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #6ee7b7; }
    .res-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }

    .open-dashboard-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      text-align: center;
      transition: all 0.2s;
    }
    .open-dashboard-btn:hover {
      background: rgba(0, 242, 254, 0.1);
      color: #00f2fe;
      border-color: #00f2fe;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-title">PhishGuard <span>XAI</span></div>
    <div class="toggle-wrap">
      <span id="toggle-lbl">Active</span>
      <label class="switch">
        <input type="checkbox" id="shield-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-scanned">0</div>
      <div class="stat-lbl">Links Scanned</div>
    </div>
    <div class="stat-card">
      <div class="stat-num danger" id="stat-blocked">0</div>
      <div class="stat-lbl">Threats Intercepted</div>
    </div>
  </div>

  <div class="quick-scan-box">
    <h4>Instant Link Scanner</h4>
    <div class="input-grp">
      <input type="text" id="popup-url" placeholder="Paste link to test...">
      <button id="popup-scan-btn">Scan</button>
    </div>
    <div id="popup-result" class="scan-res-area"></div>
  </div>

  <button class="open-dashboard-btn" id="open-dashboard-btn">
    Open Full SOC Console &rarr;
  </button>

  <script src="popup.js"></script>
</body>
</html>
